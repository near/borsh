name: Lean spec

on:
  pull_request:
    paths:
      - 'lean/**'
      - '.github/workflows/lean.yml'
  push:
    branches:
      - master
    paths:
      - 'lean/**'
      - '.github/workflows/lean.yml'

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lean:
    name: Build, prove and check vectors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # lake build (warnings, including `sorry`, are errors), lake test (vectors.tsv),
      # and leanchecker, which re-checks the proofs with the standalone kernel.
      - name: Build, test and re-check
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: lean
          build: true
          test: true
          lint: false
          leanchecker: true
          leanchecker-args: Spec Theorems
          use-mathlib-cache: false
