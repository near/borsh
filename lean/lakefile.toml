name = "borsh-spec"
defaultTargets = ["Spec", "Theorems", "borsh-spec"]
testDriver = "«borsh-spec»"
testDriverArgs = ["check", "vectors.tsv"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[lean_lib]]
name = "Spec"

[[lean_lib]]
name = "Theorems"

[[lean_exe]]
name = "borsh-spec"
root = "Main"
